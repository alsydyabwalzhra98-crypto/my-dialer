name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  APP_NAME: 'abuzahra-voip'
  DATABASE_URL: 'file:../db/custom.db'

jobs:
  build-android-apk:
    name: بناء APK اندرويد
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── 1. سحب الكود ───
      - name: سحب الكود
        uses: actions/checkout@v4

      # ─── 2. إعداد Node.js ───
      - name: إعداد Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ─── 3. إصلاح إصدارات المكتبات (مع استثناءات) ───
      - name: إصلاح إصدارات المكتبات من npm
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const allDeps = { ...pkg.dependencies, ...pkg.devDependencies };
          const SKIP = ['prisma', '@prisma/client', 'next', 'react', 'react-dom', 'next-auth', 'eslint-config-next'];
          let fixed = 0;
          
          for (const [name, version] of Object.entries(allDeps)) {
            if (SKIP.includes(name)) {
              console.log('SKIP (protected): ' + name + ' ' + version);
              continue;
            }
            const ver = version.replace(/[\^~]/g, '');
            try {
              const info = JSON.parse(
                execSync('npm view ' + name + ' version --json 2>/dev/null', { encoding: 'utf8', timeout: 15000 }).trim()
              );
              const latest = Array.isArray(info) ? info[info.length - 1] : info;
              const major = latest.split('.')[0];
              const reqMajor = ver.split('.')[0];
              
              if (major !== reqMajor) {
                const newVer = '^' + latest;
                if (pkg.dependencies[name]) {
                  pkg.dependencies[name] = newVer;
                } else if (pkg.devDependencies[name]) {
                  pkg.devDependencies[name] = newVer;
                }
                console.log('FIXED: ' + name + ' ' + version + ' -> ' + newVer);
                fixed++;
              } else {
                console.log('OK: ' + name + ' ' + version);
              }
            } catch (e) {
              console.log('SKIP: ' + name + ' (cannot verify)');
            }
          }
          
          // تثبيت نسخ Prisma 6 محددة (Prisma 7 يكسر الـ schema)
          pkg.dependencies['prisma'] = '6.11.1';
          pkg.dependencies['@prisma/client'] = '6.11.1';
          console.log('PINNED: prisma@6.11.1 and @prisma/client@6.11.1');
          
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('\nTotal packages fixed: ' + fixed);
          "

      # ─── 4. حذف ملفات القفل القديمة ───
      - name: تنظيف ملفات القفل
        run: |
          rm -f package-lock.json bun.lockb bun.lock yarn.lock

      # ─── 5. تثبيت المكتبات ───
      - name: تثبيت المكتبات
        run: npm install --legacy-peer-deps

      # ─── 6. إعداد قاعدة البيانات وتوليد Prisma Client ───
      - name: إعداد قاعدة البيانات وتوليد Prisma Client
        run: |
          mkdir -p db
          if [ ! -f "db/custom.db" ]; then
            touch db/custom.db
            echo "تم إنشاء قاعدة بيانات فارغة"
          fi
          npx prisma generate
          npx prisma db push --skip-generate 2>/dev/null || true
          echo "تم توليد Prisma Client بنجاح"

      # ─── 7. بناء Next.js ───
      - name: بناء Next.js
        run: npx next build
        env:
          NODE_ENV: production

      # ─── 8. إنشاء مجلد out لـ Capacitor ───
      - name: إنشاء مجلد out للـ Capacitor
        run: |
          mkdir -p out/_next/static
          if [ -d ".next/static" ]; then
            cp -r .next/static/* out/_next/static/
          fi
          if [ -d "public" ]; then
            cp -r public/* out/ 2>/dev/null || true
          fi
          if [ -f ".next/server/app/index.html" ]; then
            cp .next/server/app/index.html out/index.html
          elif [ -f ".next/server/app/index.rsc" ]; then
            cat > out/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
            <meta name="theme-color" content="#0078D7"/>
            <meta name="apple-mobile-web-app-capable" content="yes"/>
            <meta name="mobile-web-app-capable" content="yes"/>
            <meta name="description" content="تطبيق VoIP عربي احترافي"/>
            <link rel="manifest" href="/manifest.json"/>
            <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
            <link rel="icon" href="/icons/icon-192x192.png"/>
            <title>أبو الزهراء - الاتصال الآمن</title>
            <script type="module" src="/_next/static/chunks/main-app.js"></script>
          </head>
          <body><div id="__next"></div></body>
          </html>
          HTMLEOF
          fi
          if [ ! -f "out/index.html" ]; then
            cat > out/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
            <meta name="theme-color" content="#0078D7"/>
            <meta name="apple-mobile-web-app-capable" content="yes"/>
            <meta name="mobile-web-app-capable" content="yes"/>
            <link rel="manifest" href="/manifest.json"/>
            <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
            <link rel="icon" href="/icons/icon-192x192.png"/>
            <title>أبو الزهراء</title>
            <script type="module" src="/_next/static/chunks/main-app.js"></script>
          </head>
          <body><div id="__next"></div></body>
          </html>
          HTMLEOF
          fi
          echo "محتويات مجلد out:"
          find out -maxdepth 2 -type f | head -20

      # ─── 9. إعداد Java ───
      - name: إعداد JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # ─── 10. إعداد Android SDK ───
      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      # ─── 11. إضافة منصة Android ───
      - name: إضافة منصة Android (Capacitor)
        run: npx cap add android
        continue-on-error: true

      # ─── 12. مزامنة Capacitor ───
      - name: مزامنة Capacitor مع Android
        run: npx cap sync android

      # ─── 13. صلاحيات Gradle ───
      - name: صلاحيات التنفيذ
        run: chmod +x android/gradlew

      # ─── 14. بناء APK Debug ───
      - name: بناء APK Debug
        if: github.event.inputs.build_type != 'release'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ─── 15. بناء APK Release ───
      - name: بناء APK Release
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ─── 16. نسخ APK النهائي ───
      - name: استخراج ملف APK
        run: |
          mkdir -p apk-output
          if [ "${{ github.event.inputs.build_type }}" = "release" ] && [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/${{ env.APP_NAME }}-release.apk
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/${{ env.APP_NAME }}.apk
            echo "BUILD_TYPE=debug" >> $GITHUB_ENV
          fi
          ls -lh apk-output/

      # ─── 17. رفع APK ───
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.BUILD_TYPE || 'debug' }}
          path: apk-output/*.apk
          retention-days: 30
          if-no-files-found: error
